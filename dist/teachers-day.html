<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e35"><meta name="robots" content="noindex,nofollow"><title>Teachers by day · Gubae</title><link rel="stylesheet" href="styles.css">
<style>
body{margin:0}.teacher-day-page{margin:0 auto;padding:28px 20px 60px;max-width:900px}.day-top{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:28px}.day-top a{color:inherit;font-size:13px}.teacher-day-page h1{font-size:30px;margin:16px 0 10px}.teacher-day-page p{line-height:1.7}.day-group{background:#fffefb;border:1px solid var(--border);border-radius:12px;padding:24px;margin:22px 0}.day-group h2{font:28px Georgia,serif;margin:0 0 8px}.day-date{font-size:13px;color:#718367}.day-assignment{padding:20px 0;border-top:1px solid var(--border);margin-top:18px}.day-assignment h3{font-size:19px;line-height:1.7;margin:0 0 8px}.day-assignment p{font-size:14px;margin:8px 0}.day-assignment a{color:var(--green)}#dayStatus{font-size:12px;color:#718367}#dayStatus.error{color:#a0543d}.day-teacher{font-weight:600}.day-phone{display:inline-block;padding:7px 0;margin-right:15px}.day-empty{padding:30px 0;line-height:1.8}@media(max-width:600px){.teacher-day-page{padding:20px 16px}.day-group{padding:18px}.day-group h2{font-size:25px}}
.teacher-send-actions{margin-top:16px}.teacher-send-actions button{font-size:13px}#teacherComposer{max-width:650px}#teacherMessage{min-height:190px;font:inherit;line-height:1.7}#composeError{color:#a0543d;font-size:13px}#composeResult{font-size:13px;color:#526c49}</style></head><body><main class="teacher-day-page"><div class="day-top"><a href="./">← Gubae workspace</a><button class="secondary" id="refreshDays">Refresh</button></div><h1>Teachers by day</h1><p class="muted">Assignments appear two days before the gubae and stay here until it ends. All dates and times follow Dubai time.</p><p id="dayStatus" role="status" aria-live="polite">Connecting to the shared schedule…</p><div id="teacherDays"></div></main><dialog id="teacherComposer"><div class="dialog-top"><span>MESSAGE TEACHER</span><button class="icon-button" id="closeTeacherComposer" aria-label="Close message">×</button></div><h2 id="composerTeacher"></h2><p id="composerMeeting"></p><form id="teacherMessageForm" class="form-stack"><label class="field">Teacher’s WhatsApp number<select id="teacherPhone" required></select></label><label class="field">Message<textarea id="teacherMessage" rows="8" required placeholder="Write your message…"></textarea></label><div class="button-row"><button type="button" class="secondary" id="insertTeacherLink">Insert Zoom invitation</button><button type="submit" class="primary" id="openTeacherWhatsApp" disabled>Open in WhatsApp ↗</button></div><p class="muted">You can edit the invitation or add your own message. Press Send inside WhatsApp to deliver it.</p><p id="composeError" role="alert"></p><p id="composeResult" role="status"></p></form></dialog><script type="module" src="teachers-day.mjs"></script></body></html>
