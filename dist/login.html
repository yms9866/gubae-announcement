<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gubae - Sign in</title><link rel="stylesheet" href="styles.css"><style>body{margin:0}.login-panel{margin:12vh auto;padding:32px;max-width:460px;border:1px solid var(--border);border-radius:14px;background:#fffefb}.login-panel h1{font:32px Georgia,serif}.login-panel p{font-size:14px;line-height:1.8}#loginStatus{white-space:pre-wrap}@media(max-width:520px){.login-panel{margin:40px 16px;padding:24px}}</style></head><body><main class="login-panel"><h1>Gubae workspace</h1><p>This workspace is private. Sign in with your authorized Google account.</p><button class="primary" id="login" disabled>Sign in with Google</button><button class="secondary" id="switchAccount" hidden>Use another account</button><p id="loginStatus" role="status">Connecting…</p></main><script type="module" src="login.mjs"></script></body></html>
